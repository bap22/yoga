<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9db4a3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Yoga Flow">
    <meta name="description" content="Progressive ashtanga yoga with Apple Health integration">
    <title>Yoga Flow - Progressive Ashtanga</title>
    <link rel="icon" href="https://github.com/bap22/yoga/raw/main/yogaicon.png">
    <link rel="apple-touch-icon" href="https://github.com/bap22/yoga/raw/main/yogaicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8f7f4;
            color: #2d2d2d;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #root {
            width: 100%;
            height: 100%;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f7f4 0%, #fafaf8 100%);
            position: relative;
            overflow-y: auto;
        }

        .tab-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: white;
            border-top: 1px solid #e8e5df;
            display: flex;
            justify-content: space-around;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab-button {
            flex: 1;
            border: none;
            background: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            color: #9db4a3;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab-button.active {
            background: rgba(157, 180, 163, 0.05);
        }

        .dashboard {
            width: 100%;
            max-width: 600px;
            padding: 20px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            color: #2d2d2d;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: white;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(157, 180, 163, 0.1);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #9db4a3;
        }

        .stat-label {
            font-size: 12px;
            color: #7a7a7a;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .streak-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(157, 180, 163, 0.1);
            text-align: center;
        }

        .today-focus {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(157, 180, 163, 0.1);
        }

        .today-label {
            font-size: 12px;
            color: #9db4a3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .today-focus-name {
            font-size: 20px;
            font-weight: 600;
            color: #2d2d2d;
            margin-bottom: 4px;
        }

        .today-focus-desc {
            font-size: 13px;
            color: #7a7a7a;
            margin-bottom: 12px;
        }

        .cta-button {
            background: #9db4a3;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cta-button:active {
            transform: scale(0.98);
            background: #8a9a90;
        }

        .health-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(157, 180, 163, 0.1);
        }

        .health-metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .health-metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            font-size: 13px;
            color: #2d2d2d;
            font-weight: 500;
        }

        .metric-value {
            font-size: 16px;
            font-weight: 700;
            color: #9db4a3;
        }

        /* WORKOUT */
        .yoga-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .back-button {
            background: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-bar {
            height: 3px;
            background: #e8e5df;
            flex: 1;
            margin: 0 16px;
        }

        .progress-fill {
            height: 100%;
            background: #9db4a3;
            transition: width 0.3s ease;
        }

        .pose-counter {
            font-size: 13px;
            color: #7a7a7a;
            font-weight: 500;
        }

        .pose-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 24px;
            margin-top: 80px;
            margin-bottom: 200px;
            padding: 0 20px;
        }

        .pose-illustration {
            width: 390px;
            height: 300px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(157, 180, 163, 0.15);
            background-image: url('https://github.com/bap22/yoga/raw/main/chatyoga.png');
            background-size: 450% 400%;
            background-position: var(--bg-pos-x, 0%) var(--bg-pos-y, 0%);
            background-repeat: no-repeat;
            background-color: #fff;
            overflow: hidden;
        }

        .pose-info {
            text-align: center;
            width: 100%;
        }

        .pose-name {
            font-size: 28px;
            font-weight: 600;
            color: #2d2d2d;
            margin-bottom: 6px;
        }

        .pose-sanskrit {
            font-size: 13px;
            color: #9db4a3;
            font-style: italic;
            margin-bottom: 12px;
        }

        .pose-description {
            font-size: 15px;
            color: #5a5a5a;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .breath-cue {
            font-size: 13px;
            color: #9db4a3;
            font-weight: 500;
            padding: 10px 14px;
            background: rgba(157, 180, 163, 0.08);
            border-radius: 10px;
            display: inline-block;
        }

        .timer-section {
            position: fixed;
            bottom: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 20;
        }

        .timer-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 10px 40px rgba(157, 180, 163, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .timer-circle::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: conic-gradient(#9db4a3 var(--progress), transparent var(--progress));
            border-radius: 50%;
        }

        .timer-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 130px;
            height: 130px;
            background: #f8f7f4;
            border-radius: 50%;
            font-size: 32px;
            font-weight: 600;
            color: #2d2d2d;
        }

        .timer-label {
            font-size: 11px;
            color: #9db4a3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            z-index: 20;
        }

        .btn-primary, .btn-secondary {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex: 1;
            max-width: 180px;
        }

        .btn-primary {
            background: #9db4a3;
            color: white;
        }

        .btn-secondary {
            background: transparent;
            color: #9db4a3;
            border: 2px solid #9db4a3;
        }

        .completion-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 40px 20px;
        }

        .completion-icon {
            font-size: 80px;
            animation: scaleIn 0.6s ease;
        }

        .completion-title {
            font-size: 32px;
            font-weight: 700;
            color: #2d2d2d;
        }

        .completion-stats {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            background: rgba(157, 180, 163, 0.08);
            border-radius: 14px;
        }

        .stat-item {
            font-size: 13px;
            color: #5a5a5a;
        }

        @keyframes scaleIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const poses = [
            { name: "Mountain Pose", sanskrit: "Tadasana", duration: 45, bgX: "98%", bgY: "-1%", desc: "Stand tall with feet together. Ground through all four corners of your feet." },
            { name: "Child's Pose", sanskrit: "Balasana", duration: 60, bgX: "-1%", bgY: "-1%", desc: "Kneel and fold forward, resting your forehead. A restorative pose." },
            { name: "Downward Dog", sanskrit: "Adho Mukha Svanasana", duration: 60, bgX: "57%", bgY: "-1%", desc: "Press palms down and lift hips high, forming an inverted V." },
            { name: "Plank Pose", sanskrit: "Chaturanga", duration: 45, bgX: "98%", bgY: "36%", desc: "Shoulders over wrists. Body in one straight line. Build strength." },
            { name: "Upward Dog", sanskrit: "Urdhva Mukha Svanasana", duration: 45, bgX: "-1%", bgY: "73%", desc: "Chest lifted, arms straight. Open your heart forward." },
            { name: "Forward Fold", sanskrit: "Uttanasana", duration: 90, bgX: "81%", bgY: "-1%", desc: "Fold from hips, letting arms hang. Let gravity do the work." },
            { name: "Warrior I", sanskrit: "Virabhadrasana I", duration: 75, bgX: "-2%", bgY: "36%", desc: "Front knee bent, back heel grounded. Raise arms overhead." },
            { name: "Warrior II", sanskrit: "Virabhadrasana II", duration: 75, bgX: "23%", bgY: "36%", desc: "Wide stance, hips open. Gaze over front fingers." },
            { name: "Triangle Pose", sanskrit: "Trikonasana", duration: 75, bgX: "49%", bgY: "36%", desc: "Extended side stretch. Reach your top arm toward the sky." },
            { name: "Tree Pose", sanskrit: "Vrksasana", duration: 60, bgX: "71%", bgY: "36%", desc: "Stand on one leg, press foot to inner thigh. Find balance." },
            { name: "Cat-Cow", sanskrit: "Marjaryasana-Bitilasana", duration: 60, bgX: "28%", bgY: "-1%", desc: "Alternate between arching and rounding your spine with breath." },
            { name: "Cobra Pose", sanskrit: "Bhujangasana", duration: 45, bgX: "24%", bgY: "74%", desc: "Chest lifts gently, using arm strength. Lengthen through the crown." },
            { name: "Butterfly Pose", sanskrit: "Baddha Konasana", duration: 90, bgX: "71%", bgY: "74%", desc: "Soles of feet together, knees out. Fold gently forward." },
            { name: "Seated Forward Fold", sanskrit: "Paschimottanasana", duration: 90, bgX: "48%", bgY: "76%", desc: "Legs extended, hinge at hips. Relax into the stretch." },
            { name: "Supine Twist", sanskrit: "Supta Parivrtta", duration: 60, bgX: "98%", bgY: "73%", desc: "Lying down, knee crosses over. Wring out your spine." },
            { name: "Happy Baby", sanskrit: "Ananda Balasana", duration: 60, bgX: "-4%", bgY: "103%", desc: "Knees to chest, hold your feet. Rock gently side to side." },
            { name: "Corpse Pose", sanskrit: "Savasana", duration: 120, bgX: "23%", bgY: "101%", desc: "Lie flat and completely relax. Let your whole body rest." }
        ];

        let appState = {
            currentTab: 'dashboard',
            currentPage: 'dashboard',
            sessionsCompleted: 0,
            currentStreak: 0,
            totalMinutes: 0,
            sessions: []
        };

        function initStorage() {
            const stored = localStorage.getItem('yogaAppState');
            if (stored) {
                appState = { ...appState, ...JSON.parse(stored) };
            }
        }

        function saveState() {
            localStorage.setItem('yogaAppState', JSON.stringify(appState));
        }

        function render() {
            const root = document.getElementById('root');
            if (appState.currentPage === 'workout') {
                renderWorkout(root);
            } else {
                renderDashboard(root);
            }
        }

        function renderDashboard(root) {
            root.innerHTML = `
                <div class="container">
                    <div class="dashboard">
                        <div class="welcome-title">Flow Today</div>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-value">${appState.sessionsCompleted}</div>
                                <div class="stat-label">Sessions</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${Math.floor(appState.totalMinutes / 60)}</div>
                                <div class="stat-label">Hours</div>
                            </div>
                        </div>
                        <div class="streak-card">
                            <div style="font-size: 48px; margin-bottom: 8px;">${appState.currentStreak > 0 ? '🔥' : '✨'}</div>
                            <div class="stat-value" style="font-size: 24px;">${appState.currentStreak}</div>
                            <div class="stat-label" style="margin-top: 8px;">Day Streak</div>
                        </div>
                        <div class="today-focus">
                            <div class="today-label">Today's Session</div>
                            <div class="today-focus-name">Beginner Flow</div>
                            <div class="today-focus-desc">17 poses in 25 minutes</div>
                            <button class="cta-button" onclick="startWorkout()">Start Session</button>
                        </div>
                    </div>
                    <div class="tab-nav">
                        <button class="tab-button active" onclick="switchTab('dashboard')">🧘 Flow</button>
                        <button class="tab-button" onclick="switchTab('history')">📋 History</button>
                        <button class="tab-button" onclick="switchTab('health')">❤️ Health</button>
                    </div>
                </div>
            `;
        }

        let currentPoseIndex = 0;
        let timeRemaining = 0;
        let isRunning = false;
        let startTime = 0;
        let pausedTime = 0;
        let sessionStartTime = 0;
        let wakeLock = null;

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                } catch (e) {}
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        function startWorkout() {
            appState.currentPage = 'workout';
            currentPoseIndex = 0;
            timeRemaining = poses[0].duration;
            isRunning = false;
            sessionStartTime = Date.now();
            render();
        }

        function renderWorkout(root) {
            if (currentPoseIndex >= poses.length) {
                completeSession(root);
                return;
            }

            const pose = poses[currentPoseIndex];
            const progressPercent = (currentPoseIndex / poses.length) * 100;
            const circleProgress = (timeRemaining / pose.duration) * 100;

            root.innerHTML = `
                <div class="container">
                    <div class="yoga-header">
                        <button class="back-button" onclick="backToDashboard()">←</button>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${progressPercent}%"></div></div>
                        <div class="pose-counter">${currentPoseIndex + 1}/${poses.length}</div>
                    </div>

                    <div class="pose-content">
                        <div class="pose-illustration" style="--bg-pos-x: ${pose.bgX}; --bg-pos-y: ${pose.bgY};"></div>
                        <div class="pose-info">
                            <div class="pose-name">${pose.name}</div>
                            <div class="pose-sanskrit">${pose.sanskrit}</div>
                            <div class="pose-description">${pose.desc}</div>
                            <div class="breath-cue">💫 Breathe deeply</div>
                        </div>
                    </div>

                    <div class="timer-section">
                        <div class="timer-circle" style="--progress: ${circleProgress}%">
                            <div class="timer-content">
                                <div>${timeRemaining}s</div>
                                <div class="timer-label">remaining</div>
                            </div>
                        </div>
                    </div>

                    <div class="controls">
                        <button class="btn-secondary" onclick="toggleTimer()">${isRunning ? 'Pause' : 'Start'}</button>
                        <button class="btn-primary" onclick="nextPose(false)">${currentPoseIndex === poses.length - 1 ? 'Finish' : 'Next'}</button>
                    </div>
                </div>
            `;
        }

        function toggleTimer() {
            if (isRunning) {
                isRunning = false;
                pausedTime = Date.now();
                releaseWakeLock();
            } else {
                isRunning = true;
                startTime = Date.now() - pausedTime;
                requestWakeLock();
            }
            updateTimer();
        }

        function nextPose(autoAdvance) {
            if (currentPoseIndex < poses.length - 1) {
                currentPoseIndex++;
                timeRemaining = poses[currentPoseIndex].duration;
                if (autoAdvance) {
                    isRunning = true;
                    startTime = Date.now();
                    pausedTime = 0;
                    render();
                    updateTimer();
                } else {
                    isRunning = false;
                    pausedTime = 0;
                    render();
                }
            } else {
                releaseWakeLock();
                completeSession();
            }
        }

        function updateTimer() {
            if (!isRunning) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            timeRemaining = Math.max(0, poses[currentPoseIndex].duration - elapsed);
            if (timeRemaining === 0) {
                nextPose(true);
            } else {
                render();
                setTimeout(updateTimer, 100);
            }
        }

        function completeSession(root) {
            const sessionDuration = Math.floor((Date.now() - sessionStartTime) / 1000);
            const sessionMinutes = Math.round(sessionDuration / 60);
            
            appState.sessionsCompleted++;
            appState.totalMinutes += sessionMinutes;
            appState.currentStreak++;
            appState.sessions.push({ date: new Date().toDateString(), duration: sessionMinutes });
            saveState();

            const container = document.getElementById('root') || root;
            container.innerHTML = `
                <div class="container">
                    <div class="completion-screen">
                        <div class="completion-icon">🙏</div>
                        <div class="completion-title">Beautiful Work</div>
                        <div class="completion-stats">
                            <div class="stat-item"><span style="color: #9db4a3; font-weight: 600;">Duration:</span> ${Math.floor(sessionDuration / 60)}m ${sessionDuration % 60}s</div>
                            <div class="stat-item"><span style="color: #9db4a3; font-weight: 600;">Poses:</span> ${poses.length}</div>
                        </div>
                        <button class="cta-button" onclick="backToDashboard()">Return Home</button>
                    </div>
                </div>
            `;
        }

        function backToDashboard() {
            appState.currentPage = 'dashboard';
            currentPoseIndex = 0;
            isRunning = false;
            releaseWakeLock();
            render();
        }

        function switchTab(tab) {
            appState.currentTab = tab;
            render();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript,').catch(() => {});
        }

        initStorage();
        render();
    </script>
</body>
</html>
